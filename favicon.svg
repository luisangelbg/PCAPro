<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PCAPro">
  <title>PCAPro</title>
  <desc>Gráfico de sedimentación: las dos primeras barras son los componentes
  retenidos; las dos últimas, los descartados.</desc>
  <defs>
    <linearGradient id="pcapro-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4ee6"/>
      <stop offset="1" stop-color="#4a31b8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#pcapro-tile)"/>
  <g>
    <rect x="102" y="126" width="68" height="260" rx="22" fill="#ffffff"/>
    <rect x="190" y="214" width="68" height="172" rx="22" fill="#ffffff"/>
    <rect x="278" y="288" width="68" height="98"  rx="22" fill="#2dd4bf"/>
    <rect x="366" y="330" width="68" height="56"  rx="22" fill="#2dd4bf"/>
  </g>
</svg>
